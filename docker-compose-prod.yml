---
x-lucky-env: &lucky-env
  DATABASE_URL: postgres://${DATABASE_USER:-khodo}:${DATABASE_PASSWORD:-password}@postgres:5432/${DATABASE_NAME:-khodo}
  REPORTING_DATABASE_URL: postgres://${DATABASE_REPORTING_USER:-khodo_reporting}:${DATABASE_REPORTING_PASSWORD:-password}@postgres:5432/${DATABASE_NAME:-khodo}
  LUCKY_ENV: production
  SECRET_KEY_BASE: ${SECRET_KEY:-}
  HOST: 127.0.0.1
  PORT: 5000
  APP_DOMAIN: ${APP_DOMAIN:-http://127.0.0.1}
  SEND_GRID_KEY: ""

services:
  server:
    image: "kwalter94/khodo:${TAG:-latest}"
    command: caddy run -c /khodo/Caddyfile
    environment:
      <<: *lucky-env
    depends_on:
      - backend
    restart: on-failure
    ports:
      - 8080:8080

  backend:
    image: "kwalter94/khodo:${TAG:-latest}"
    command: /khodo/start_server
    environment:
      <<: *lucky-env
    depends_on:
      - postgres
    restart: on-failure

  db-setup:
    image: "kwalter94/khodo:${TAG:-latest}"
    command: sh -c "/khodo/tasks db.migrate && /khodo/tasks db.seed.required_data"
    environment:
      <<: *lucky-env
    depends_on:
      - postgres
    restart: on-failure

  postgres:
    image: pgduckdb/pgduckdb:16-main
    command: ["-c", "duckdb.postgres_role=${DATABASE_REPORTING_USER:-khodo_reporting}", "-c", "shared_preload_libraries=pg_duckdb"]
    environment:
      POSTGRES_USER: ${DATABASE_USER:-khodo}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-password}
      POSTGRES_REPORTING_USER: ${DATABASE_REPORTING_USER:-khodo_reporting}
      POSTGRES_REPORTING_PASSWORD: ${DATABASE_REPORTING_PASSWORD:-password}
      POSTGRES_DB: ${DATABASE_NAME:-khodo}
    ports:
      - 6543:5432
    restart: on-failure
    user: root
    volumes:
      - ./docker/pg_initdb.d/:/docker-entrypoint-initdb.d
